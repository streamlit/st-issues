[project]
name = "st-issues"
version = "0.1.0"
description = "Various tools to help with the Streamlit library development."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "streamlit[performance]>=1.61.1",
  "pandas",
  "numpy",
  "plotly",
  "altair>=5",
  "matplotlib",
  "seaborn",
  "pydeck",
  "streamlit-extras",
  "pytz",
  "vega-datasets",
  "psutil",
  "streamlit-folium",
  "streamlit-aggrid",
  "humanize",
  "coverage",
  "httpx",
  "polars",
  "streamlit-pdf",
  "git-fame",
  "scipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# =============================================================================
# UV configuration
# =============================================================================
[tool.uv]
default-groups = ["dev"]

# =============================================================================
# Development dependencies
# =============================================================================
[dependency-groups]
dev = [
  "pytest>=9.0.2",
  "ruff==0.16.5",
  "ty==0.0.75",
  "mypy==2.3.1",
  "watchdog",
  "pandas-stubs",
  "pre-commit>=4.6.2",
]

# =============================================================================
# Ruff configuration (linting + formatting)
# =============================================================================
[tool.ruff]
line-length = 120
extend-exclude = [
  "issues/**",
  "archive/**",
  "static/**",
]

[tool.ruff.lint]
preview = true
select = [
  "ALL", # All rules
]
ignore = [
  # Ignored rule sets:
  "DTZ", # Checks for usage of unsafe naive datetime class.
  "C90", # Checks for McCabe complexity.
  "SLF", # Checks unexpected for private member access.
  "BLE", # Checks for blind except statements.
  "CPY", # Checks for copyright statement.
  "DOC", # Checks for correct docstring format.
  "FBT", # Checks for Boolean-typed positional argument in function definition.
  # Ignored rules (sorted alphabetically):
  "any-type",  # Allow Any type in annotations.
  "missing-trailing-comma",  # Trailing comma missing. Not recommended with formatter.
  "prohibited-trailing-comma",  # Trailing comma prohibited. Not recommended with formatter.
  "undocumented-public-module",    # Missing docstring in public module.
  "undocumented-public-class",    # Missing docstring in public class.
  "undocumented-public-function",    # Missing docstring in public function.
  "undocumented-public-package",    # Missing docstring in public package.
  "undocumented-public-init",    # Missing docstring in __init__.
  "line-too-long",    # Line too long. Ignored for user-facing strings and help text.
  "commented-out-code",  # Commented out code.
  "line-contains-todo",  # Disallow TODO comments.
  "math-constant", # Math constants should use math module.
  "import-outside-top-level", # Imports not at top-level.
  "import-private-name", # Import of private name.
  "too-many-public-methods", # Too many public methods.
  "too-many-return-statements", # Too many return statements.
  "too-many-branches", # Too many branches.
  "too-many-arguments", # Too many arguments.
  "too-many-locals", # Too many local variables.
  "too-many-statements", # Too many statements.
  "too-many-boolean-expressions", # Too many boolean expressions.
  "too-many-positional-arguments", # Too many positional arguments.
  "too-many-nested-blocks", # Too many nested blocks.
  "magic-value-comparison", # Magic value used in comparison.
  "no-self-use", # Method could be function (no self usage).
  "too-many-statements-in-try-clause", # Too many statements in try clause.
  "unnecessary-assign",  # Unnecessary assignment before return.
  "used-dummy-variable",  # Dummy variable accessed.
  "non-empty-init-module",  # Non-empty __init__ module.
  "multiple-with-statements",  # Multiple with statements should be combined.
  "print",    # Print statement found.
  "missing-todo-author",   # Missing author in TODO.
  "missing-todo-link",   # Missing issue link in TODO.
  "try-consider-else",  # Consider else block instead of return in try.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "ANN",    # Ignore annotation rules (test functions don't need full typing).
  "ARG",    # Allow unused arguments (common in test fixtures and mocks).
  "D",      # Ignore docstring rules (tests are self-documenting via names).
  "INP",    # Allow implicit namespace packages (test directories).
  "N",      # Ignore naming conventions (test names can be descriptive/long).
  "PERF",   # Ignore performance rules (clarity over speed in tests).
  "S",      # Ignore bandit security rules (test code doesn't need security hardening).
  "TRY",    # Ignore tryceratops rules (simpler exception handling in tests).
]
extend-safe-fixes = ["typing-only-third-party-import", "typing-only-standard-library-import"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.pydocstyle]
# Use the Google style for docstrings.
convention = "google"

[tool.ruff.lint.flake8-unused-arguments]
# Ignore unused variadic argument, like *args and **kwargs.
ignore-variadic-names = true

[tool.ruff.lint.flake8-comprehensions]
# Allow dict calls that make use of keyword arguments (e.g., dict(a=1, b=2)).
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.flake8-tidy-imports]
# Disallow all relative imports.
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

# =============================================================================
# mypy configuration (type checking)
# =============================================================================
[tool.mypy]
python_version = "3.13"
files = ["app"]
cache_dir = ".mypy_cache"
incremental = true
warn_return_any = false                 # Don't warn when returning Any from typed function
warn_unused_ignores = false             # Don't warn about unused # type: ignore comments
check_untyped_defs = true               # Type check inside untyped functions
ignore_missing_imports = true           # Silence errors for imports without stubs
disallow_any_generics = false           # Allow generic types without type parameters (e.g. List instead of List[int])
disallow_untyped_defs = true            # Require type annotations on all functions
disallow_incomplete_defs = true         # Require full signatures (no partial annotations)
disable_error_code = ["import-untyped"] # Disable error code for imports without stubs

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true


# =============================================================================
# ty configuration (type checking)
# =============================================================================
[tool.ty.src]
# Only check the app directory, exclude archive and issues (example files)
include = ["app"]

[tool.ty.rules]
unused-ignore-comment = "ignore" # Allow mypy-compatible ignore comments

# =============================================================================
# pytest configuration
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
